# ═══════════════════════════════════════════════════════════════
# FASE 1 · CORE OPERATIVO v1.2
#
# Cambios vs v1.1:
# - BUG #4 fix: dify-sandbox REMOVIDO (vector de ataque + 100MB)
# - PgBouncer agregado (pool de conexiones, 50MB)
# - Init de DBs movido a script externo idempotente (BUG #1)
# - Dify env vars actualizadas para v0.13.2 oficial (sin sandbox)
# - Versions pinneadas en TODO
# ═══════════════════════════════════════════════════════════════

networks:
  nexus-public:
    name: nexus-public
    driver: bridge
  nexus-backbone:
    name: nexus-backbone
    driver: bridge
    internal: true
  nexus-ai:
    name: nexus-ai
    driver: bridge
  nexus-automation:
    name: nexus-automation
    driver: bridge

volumes:
  traefik_certs:
    name: nexus_traefik_certs
  postgres_data:
    name: nexus_postgres_data
  redis_data:
    name: nexus_redis_data
  qdrant_data:
    name: nexus_qdrant_data
  dify_storage:
    name: nexus_dify_storage
  n8n_data:
    name: nexus_n8n_data
  uptimekuma_data:
    name: nexus_uptimekuma_data

services:
  # ────────── TRAEFIK ──────────
  traefik:
    image: traefik:v3.1
    container_name: nexus-traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=nexus-public"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/certs/acme.json"
      - "--certificatesresolvers.le.acme.tlschallenge=true"
      # STAGING (descomentar para primeros deploys y evitar rate limit LE):
      # - "--certificatesresolvers.le.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/certs
      - ../configs/traefik-basic-auth.yml:/etc/traefik/dynamic/auth.yml:ro
    networks:
      - nexus-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.tls.certresolver=le"
      - "traefik.http.routers.dashboard.middlewares=basic-auth@file"

  # ────────── POSTGRES ──────────
  postgres:
    image: postgres:16.6-alpine
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_ADMIN_USER}
      POSTGRES_PASSWORD: ${PG_ADMIN_PASS}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nexus-backbone
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=1536MB"

  # ────────── PGBOUNCER · pool de conexiones (Kimi opportunity K) ──────────
  # 50MB · maneja 1000+ conexiones cliente con solo 50 al backend
  pgbouncer:
    image: edoburu/pgbouncer:1.23.1
    container_name: nexus-pgbouncer
    restart: unless-stopped
    environment:
      DATABASE_URLS: "postgres://${PG_ADMIN_USER}:${PG_ADMIN_PASS}@postgres:5432/postgres,postgres://${PG_ADMIN_USER}:${PG_ADMIN_PASS}@postgres:5432/evolution,postgres://${PG_ADMIN_USER}:${PG_ADMIN_PASS}@postgres:5432/listmonk,postgres://${PG_ADMIN_USER}:${PG_ADMIN_PASS}@postgres:5432/postiz"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 25
      RESERVE_POOL_SIZE: 5
      AUTH_TYPE: scram-sha-256
      AUTH_USER: ${PG_ADMIN_USER}
      ADMIN_USERS: ${PG_ADMIN_USER}
      LISTEN_PORT: 6432
      SERVER_TLS_SSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexus-backbone
      - nexus-ai
      - nexus-automation

  # ────────── REDIS ──────────
  redis:
    image: redis:7.4.1-alpine
    container_name: nexus-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASS}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - nexus-backbone
      - nexus-ai
      - nexus-automation
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASS}", "ping"]
      interval: 10s

  # ────────── QDRANT ──────────
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: nexus-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_KEY}
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - nexus-ai
      - nexus-automation

  # ────────── LITELLM ──────────
  litellm:
    image: ghcr.io/berriai/litellm:main-v1.52.0
    container_name: nexus-litellm
    restart: unless-stopped
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      # Apunta a PgBouncer, no a Postgres directo (K8 opportunity)
      DATABASE_URL: postgresql://litellm_app:${PG_LITELLM_PASS}@postgres:5432/litellm  # Day 1: directo. Cambiar a pgbouncer:6432 semana 2
      STORE_MODEL_IN_DB: "true"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      REDIS_PASS: ${REDIS_PASS}
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: --config /app/config.yaml --port 4000 --num_workers 2
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexus-public
      - nexus-backbone
      - nexus-ai
      - nexus-automation
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.litellm.rule=Host(`llm.${DOMAIN}`)"
      - "traefik.http.routers.litellm.entrypoints=websecure"
      - "traefik.http.routers.litellm.tls.certresolver=le"
      - "traefik.http.services.litellm.loadbalancer.server.port=4000"

  # ────────── DIFY API · SIN SANDBOX (Bug #4 fix) ──────────
  dify-api:
    image: langgenius/dify-api:0.13.2
    container_name: nexus-dify-api
    restart: unless-stopped
    environment:
      MODE: api
      LOG_LEVEL: INFO
      SECRET_KEY: ${DIFY_SECRET_KEY}
      CONSOLE_API_URL: https://dify.${DOMAIN}
      CONSOLE_WEB_URL: https://dify.${DOMAIN}
      SERVICE_API_URL: https://dify.${DOMAIN}
      APP_API_URL: https://dify.${DOMAIN}
      APP_WEB_URL: https://dify.${DOMAIN}
      MIGRATION_ENABLED: "true"
      DB_USERNAME: dify_app
      DB_PASSWORD: ${PG_DIFY_PASS}
      DB_HOST: postgres  # Day 1: directo. Cambiar a pgbouncer:6432 semana 2
      DB_PORT: 5432
      DB_DATABASE: dify
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASS}
      REDIS_DB: 1
      CELERY_BROKER_URL: redis://:${REDIS_PASS}@redis:6379/2
      VECTOR_STORE: qdrant
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_KEY}
      STORAGE_TYPE: opendal
      OPENDAL_SCHEME: fs
      OPENDAL_FS_ROOT: /app/storage
      # CODE EXECUTION DESACTIVADO (sin sandbox)
      CODE_EXECUTION_ENDPOINT: ""
      OPENAI_API_BASE: http://litellm:4000/v1
    volumes:
      - dify_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexus-public
      - nexus-backbone
      - nexus-ai
      - nexus-automation
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dify-api.rule=Host(`dify.${DOMAIN}`) && (PathPrefix(`/console/api`) || PathPrefix(`/api`) || PathPrefix(`/v1`) || PathPrefix(`/files`))"
      - "traefik.http.routers.dify-api.entrypoints=websecure"
      - "traefik.http.routers.dify-api.tls.certresolver=le"
      - "traefik.http.routers.dify-api.priority=10"
      - "traefik.http.services.dify-api.loadbalancer.server.port=5001"

  dify-worker:
    image: langgenius/dify-api:0.13.2
    container_name: nexus-dify-worker
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:5001/health')\" 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      MODE: worker
      LOG_LEVEL: INFO
      SECRET_KEY: ${DIFY_SECRET_KEY}
      DB_USERNAME: dify_app
      DB_PASSWORD: ${PG_DIFY_PASS}
      DB_HOST: postgres  # Day 1: directo. Cambiar a pgbouncer:6432 semana 2
      DB_PORT: 5432
      DB_DATABASE: dify
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASS}
      REDIS_DB: 1
      CELERY_BROKER_URL: redis://:${REDIS_PASS}@redis:6379/2
      VECTOR_STORE: qdrant
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_KEY}
      STORAGE_TYPE: opendal
      OPENDAL_SCHEME: fs
      OPENDAL_FS_ROOT: /app/storage
    volumes:
      - dify_storage:/app/storage
    depends_on:
      - dify-api
    networks:
      - nexus-backbone
      - nexus-ai

  dify-web:
    image: langgenius/dify-web:0.13.2
    container_name: nexus-dify-web
    restart: unless-stopped
    environment:
      CONSOLE_API_URL: https://dify.${DOMAIN}
      APP_API_URL: https://dify.${DOMAIN}
    networks:
      - nexus-public
      - nexus-ai
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dify-web.rule=Host(`dify.${DOMAIN}`)"
      - "traefik.http.routers.dify-web.entrypoints=websecure"
      - "traefik.http.routers.dify-web.tls.certresolver=le"
      - "traefik.http.routers.dify-web.priority=1"
      - "traefik.http.services.dify-web.loadbalancer.server.port=3000"

  # ════════════════════════════════════════════════════════════
  #  NO HAY dify-sandbox EN v1.2
  #  Razón: ENABLE_NETWORK:true + ejecución arbitraria de código
  #  = vector de ataque. Code execution se reactiva semana 2 con
  #  network: "false" (sandbox aislado real)
  # ════════════════════════════════════════════════════════════

  # ────────── N8N MAIN ──────────
  n8n-main:
    image: n8nio/n8n:1.70.0
    container_name: nexus-n8n
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres  # Day 1: directo. Cambiar a pgbouncer:6432 semana 2
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n_app
      DB_POSTGRESDB_PASSWORD: ${PG_N8N_PASS}
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASS}
      QUEUE_BULL_REDIS_DB: 3
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_USER_MANAGEMENT_JWT_SECRET: ${N8N_USER_MGMT_JWT_SECRET}
      N8N_HOST: n8n.${DOMAIN}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.${DOMAIN}/
      N8N_EDITOR_BASE_URL: https://n8n.${DOMAIN}/
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}
      N8N_RUNNERS_ENABLED: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
      # FORMS habilitados (BUG #5 fix: HITL real)
      N8N_FORMS_ENABLED: "true"
      # ── Business vars for workflows ──
      DOMAIN: ${DOMAIN}
      OPERATOR_WHATSAPP: ${OPERATOR_WHATSAPP}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      AINEXUS_INSTANCE: ${AINEXUS_INSTANCE:-ainexus-main}
      DIFY_API_KEY: ${DIFY_API_KEY:-CAMBIAME}
      DIFY_LEAD_QUALIFIER_KEY: ${DIFY_LEAD_QUALIFIER_KEY:-CAMBIAME}
      DIFY_CONCIERGE_KEY: ${DIFY_CONCIERGE_KEY:-CAMBIAME}
      POSTIZ_API_KEY: ${POSTIZ_API_KEY:-CAMBIAME}
      LISTMONK_ADMIN_USER: ${LISTMONK_ADMIN_USER:-admin}
      LISTMONK_ADMIN_PASS: ${LISTMONK_ADMIN_PASS}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexus-public
      - nexus-backbone
      - nexus-ai
      - nexus-automation
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.${DOMAIN}`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls.certresolver=le"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"

  n8n-worker:
    image: n8nio/n8n:1.70.0
    container_name: nexus-n8n-worker
    restart: unless-stopped
    command: worker
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres  # Day 1: directo. Cambiar a pgbouncer:6432 semana 2
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n_app
      DB_POSTGRESDB_PASSWORD: ${PG_N8N_PASS}
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASS}
      QUEUE_BULL_REDIS_DB: 3
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      QUEUE_HEALTH_CHECK_ACTIVE: "true"
      GENERIC_TIMEZONE: ${TZ}
      # ── Business vars for workflows (MUST match n8n-main) ──
      DOMAIN: ${DOMAIN}
      OPERATOR_WHATSAPP: ${OPERATOR_WHATSAPP}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      AINEXUS_INSTANCE: ${AINEXUS_INSTANCE:-ainexus-main}
      DIFY_API_KEY: ${DIFY_API_KEY:-CAMBIAME}
      DIFY_LEAD_QUALIFIER_KEY: ${DIFY_LEAD_QUALIFIER_KEY:-CAMBIAME}
      DIFY_CONCIERGE_KEY: ${DIFY_CONCIERGE_KEY:-CAMBIAME}
      POSTIZ_API_KEY: ${POSTIZ_API_KEY:-CAMBIAME}
      LISTMONK_ADMIN_USER: ${LISTMONK_ADMIN_USER:-admin}
      LISTMONK_ADMIN_PASS: ${LISTMONK_ADMIN_PASS}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
    depends_on:
      - n8n-main
    networks:
      - nexus-backbone
      - nexus-ai
      - nexus-automation


  n8n-worker-2:
    image: n8nio/n8n:1.70.0
    container_name: nexus-n8n-worker-2
    restart: unless-stopped
    command: worker
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres  # Day 1: directo. Cambiar a pgbouncer:6432 semana 2
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n_app
      DB_POSTGRESDB_PASSWORD: ${PG_N8N_PASS}
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASS}
      QUEUE_BULL_REDIS_DB: 3
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${TZ}
      N8N_RUNNERS_ENABLED: "true"
      QUEUE_HEALTH_CHECK_ACTIVE: "true"
      # ── Business vars for workflows (MUST match n8n-main) ──
      DOMAIN: ${DOMAIN}
      OPERATOR_WHATSAPP: ${OPERATOR_WHATSAPP}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      AINEXUS_INSTANCE: ${AINEXUS_INSTANCE:-ainexus-main}
      DIFY_API_KEY: ${DIFY_API_KEY:-CAMBIAME}
      DIFY_LEAD_QUALIFIER_KEY: ${DIFY_LEAD_QUALIFIER_KEY:-CAMBIAME}
      DIFY_CONCIERGE_KEY: ${DIFY_CONCIERGE_KEY:-CAMBIAME}
      POSTIZ_API_KEY: ${POSTIZ_API_KEY:-CAMBIAME}
      LISTMONK_ADMIN_USER: ${LISTMONK_ADMIN_USER:-admin}
      LISTMONK_ADMIN_PASS: ${LISTMONK_ADMIN_PASS}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      N8N_USER_MANAGEMENT_JWT_SECRET: ${N8N_USER_MGMT_JWT_SECRET}  # fix Kimi M6
    depends_on:
      - n8n-main
    networks:
      - nexus-backbone
      - nexus-ai
      - nexus-automation

  # ────────── UPTIME KUMA ──────────
  uptimekuma:
    image: louislam/uptime-kuma:1.23.16-alpine
    container_name: nexus-uptimekuma
    restart: unless-stopped
    volumes:
      - uptimekuma_data:/app/data
    networks:
      - nexus-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.status.rule=Host(`status.${DOMAIN}`)"
      - "traefik.http.routers.status.entrypoints=websecure"
      - "traefik.http.routers.status.tls.certresolver=le"
      - "traefik.http.services.status.loadbalancer.server.port=3001"
