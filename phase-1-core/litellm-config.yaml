# ═══════════════════════════════════════════════════════════════
# LITELLM CONFIG v1.2
#
# BUG #2 FIX (Kimi): Modelos Anthropic con IDs verificados contra
# docs oficiales mayo 2026:
#   - claude-opus-4-7        (flagship)
#   - claude-sonnet-4-6      (balanced)
#   - claude-haiku-4-5-20251001  (fast)
#
# Verificación: https://docs.anthropic.com/en/release-notes/api
# y https://github.com/anthropics/skills/blob/main/skills/claude-api/shared/models.md
# ═══════════════════════════════════════════════════════════════

model_list:
  # ─── DEEPSEEK · barato + español ───
  - model_name: cheap-spanish
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY
      max_tokens: 4096

  - model_name: cheap-coder
    litellm_params:
      model: deepseek/deepseek-coder
      api_key: os.environ/DEEPSEEK_API_KEY

  # ─── CLAUDE · IDs REALES (verificados mayo 2026) ───
  - model_name: creative
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
      max_tokens: 8192

  - model_name: creative-fast
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY
      max_tokens: 4096

  - model_name: creative-premium
    litellm_params:
      model: anthropic/claude-opus-4-7
      api_key: os.environ/ANTHROPIC_API_KEY
      max_tokens: 8192

  # ─── GPT ───
  - model_name: strategy
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
      max_tokens: 4096

  - model_name: strategy-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  # ─── GEMINI ───
  - model_name: long-research
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY

  - model_name: long-research-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  # ─── ALIASES POR ROL (también con IDs reales) ───
  - model_name: agent-pm
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  - model_name: agent-creative
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: agent-research
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY

  - model_name: agent-copy-es
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY

  - model_name: agent-triage
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

# ═══════════════════════════════════════════════════════════════
# ROUTER · Fallbacks entre modelos cloud existentes
# ═══════════════════════════════════════════════════════════════
router_settings:
  routing_strategy: usage-based-routing-v2
  num_retries: 2
  timeout: 60
  fallbacks:
    - creative: [strategy, cheap-spanish]
    - creative-fast: [agent-triage, cheap-spanish]
    - creative-premium: [creative, strategy]
    - cheap-spanish: [creative-fast, strategy-mini]
    - strategy: [creative, long-research]
    - long-research: [strategy, creative]
    - agent-pm: [agent-creative]
    - agent-creative: [agent-pm]
    - agent-copy-es: [agent-triage]
    - agent-research: [agent-pm]

# ═══════════════════════════════════════════════════════════════
# CACHE Redis (sin callbacks rotos)
# ═══════════════════════════════════════════════════════════════
litellm_settings:
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    password: os.environ/REDIS_PASS
    ttl: 3600
  set_verbose: false
  json_logs: true
  drop_params: true

# ═══════════════════════════════════════════════════════════════
# GENERAL
# ═══════════════════════════════════════════════════════════════
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  ui_username: admin
  ui_password: os.environ/LITELLM_UI_PASSWORD  # Separada de MASTER_KEY — fix Kimi C1
